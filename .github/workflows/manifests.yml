name: Manifest CI

on:
  pull_request:
    paths:
      - '*.json'
      - 'bucket/*.json'
      - '.gitattributes'
      - 'Scoop-Bucket.Tests.ps1'
      - '.github/workflows/manifests.yml'
  workflow_dispatch:

permissions: {}

jobs:
  manifests:
    name: manifests / Scoop manifest validation
    runs-on: windows-2025
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout bucket
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2
          path: bucket-under-test
          persist-credentials: false

      - name: Checkout pinned Scoop
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ScoopInstaller/Scoop
          ref: b588a06e41d920d2123ec70aee682bae14935939
          path: scoop-core
          persist-credentials: false

      - name: Install and cache test dependencies
        uses: potatoqualitee/psmodulecache@ee5e9494714abf56f6efbfa51527b2aec5c761b8 # v6.2.1
        with:
          modules-to-cache: BuildHelpers, Pester
          shell: pwsh

      - name: Run pinned Scoop bucket tests
        shell: pwsh
        run: |
          $env:SCOOP_HOME = Resolve-Path '.\scoop-core'
          $env:CI = ''
          $result = Invoke-Pester -Path '.\bucket-under-test' -PassThru -Output Detailed
          if ($result.FailedCount -ne 0) {
              throw "Pinned Scoop bucket tests reported $($result.FailedCount) failure(s)."
          }

      - name: Exercise bucket lifecycle
        shell: pwsh
        env:
          BUCKET_REPOSITORY: https://github.com/meigma/scoop-bucket-rehearsal
        run: |
          $ErrorActionPreference = 'Stop'
          $env:SCOOP = Join-Path $env:RUNNER_TEMP 'scoop-data'
          'apps', 'buckets', 'cache', 'persist', 'shims' | ForEach-Object {
              New-Item (Join-Path $env:SCOOP $_) -ItemType Directory -Force | Out-Null
          }
          $scoopRoot = Resolve-Path '.\scoop-core'
          $scoopApp = New-Item (Join-Path $env:SCOOP 'apps\scoop') -ItemType Directory -Force
          New-Item (Join-Path $scoopApp 'current') -ItemType Junction -Target $scoopRoot | Out-Null
          $scoop = Join-Path $scoopRoot 'bin\scoop.ps1'
          $checkout = Resolve-Path '.\bucket-under-test'

          function Invoke-Scoop {
              param([Parameter(ValueFromRemainingArguments = $true)][string[]]$Arguments)
              & $scoop @Arguments
              if ($LASTEXITCODE -ne 0) {
                  throw "scoop $($Arguments -join ' ') failed with exit code $LASTEXITCODE"
              }
          }
          Invoke-Scoop config LAST_UPDATE ([DateTime]::Now.ToString('o'))


          Invoke-Scoop bucket add meigma-rehearsal $env:BUCKET_REPOSITORY
          $bucketList = Invoke-Scoop bucket list | Out-String
          Write-Host $bucketList
          if ($bucketList -notmatch 'meigma-rehearsal') {
              throw 'The rehearsal bucket is missing from scoop bucket list.'
          }

          $search = Invoke-Scoop search meigma-release-cli | Out-String
          Write-Host $search
          if ($search -notmatch 'meigma-release-cli') {
              throw 'The root manifest is not discoverable through scoop search.'
          }

          $installedBucket = Join-Path $env:SCOOP 'buckets\meigma-rehearsal'
          $baseManifestPath = if (Test-Path (Join-Path $installedBucket 'bucket\meigma-release-cli.json')) {
              Join-Path $installedBucket 'bucket\meigma-release-cli.json'
          } else {
              Join-Path $installedBucket 'meigma-release-cli.json'
          }
          $baseVersion = (Get-Content $baseManifestPath -Raw | ConvertFrom-Json).version

          Invoke-Scoop install meigma-rehearsal/meigma-release-cli
          $executable = Join-Path $env:SCOOP 'apps\meigma-release-cli\current\release-cli.exe'
          $baseOutput = & $executable version | Out-String
          Write-Host $baseOutput
          if ($LASTEXITCODE -ne 0 -or $baseOutput -notmatch [regex]::Escape($baseVersion)) {
              throw "Installed command did not report baseline version $baseVersion."
          }

          $candidatePath = if (Test-Path (Join-Path $checkout 'bucket\meigma-release-cli.json')) {
              Join-Path $checkout 'bucket\meigma-release-cli.json'
          } else {
              Join-Path $checkout 'meigma-release-cli.json'
          }
          $candidateVersion = (Get-Content $candidatePath -Raw | ConvertFrom-Json).version

          Remove-Item (Join-Path $installedBucket 'meigma-release-cli.json') -Force -ErrorAction SilentlyContinue
          New-Item (Split-Path (Join-Path $installedBucket ($candidatePath.Substring($checkout.Path.Length + 1)))) -ItemType Directory -Force | Out-Null
          Copy-Item $candidatePath (Join-Path $installedBucket ($candidatePath.Substring($checkout.Path.Length + 1))) -Force

          Invoke-Scoop update meigma-release-cli --force
          $candidateOutput = & $executable version | Out-String
          Write-Host $candidateOutput
          if ($LASTEXITCODE -ne 0 -or $candidateOutput -notmatch [regex]::Escape($candidateVersion)) {
              throw "Updated command did not report candidate version $candidateVersion."
          }

          Invoke-Scoop uninstall meigma-release-cli
          if (Test-Path (Join-Path $env:SCOOP 'apps\meigma-release-cli')) {
              throw 'Scoop left the application installed after uninstall.'
          }

  arm64:
    name: manifests / Windows ARM64 lifecycle
    runs-on: windows-11-arm
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout bucket
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: bucket-under-test
          persist-credentials: false

      - name: Checkout pinned Scoop
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ScoopInstaller/Scoop
          ref: b588a06e41d920d2123ec70aee682bae14935939
          path: scoop-core
          persist-credentials: false

      - name: Exercise ARM64 bucket lifecycle
        shell: pwsh
        env:
          BUCKET_REPOSITORY: https://github.com/meigma/scoop-bucket-rehearsal
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:PROCESSOR_ARCHITECTURE -ne 'ARM64') {
              throw "Expected an ARM64 host, got $env:PROCESSOR_ARCHITECTURE."
          }

          $env:SCOOP = Join-Path $env:RUNNER_TEMP 'scoop-data'
          'apps', 'buckets', 'cache', 'persist', 'shims' | ForEach-Object {
              New-Item (Join-Path $env:SCOOP $_) -ItemType Directory -Force | Out-Null
          }
          $scoopRoot = Resolve-Path '.\scoop-core'
          $scoopApp = New-Item (Join-Path $env:SCOOP 'apps\scoop') -ItemType Directory -Force
          New-Item (Join-Path $scoopApp 'current') -ItemType Junction -Target $scoopRoot | Out-Null
          $scoop = Join-Path $scoopRoot 'bin\scoop.ps1'
          $checkout = Resolve-Path '.\bucket-under-test'

          function Invoke-Scoop {
              param([Parameter(ValueFromRemainingArguments = $true)][string[]]$Arguments)
              & $scoop @Arguments
              if ($LASTEXITCODE -ne 0) {
                  throw "scoop $($Arguments -join ' ') failed with exit code $LASTEXITCODE"
              }
          }

          Invoke-Scoop config LAST_UPDATE ([DateTime]::Now.ToString('o'))
          Invoke-Scoop bucket add meigma-rehearsal $env:BUCKET_REPOSITORY

          $candidatePath = if (Test-Path (Join-Path $checkout 'bucket\meigma-release-cli.json')) {
              Join-Path $checkout 'bucket\meigma-release-cli.json'
          } else {
              Join-Path $checkout 'meigma-release-cli.json'
          }
          $candidateVersion = (Get-Content $candidatePath -Raw | ConvertFrom-Json).version
          $installedBucket = Join-Path $env:SCOOP 'buckets\meigma-rehearsal'
          Remove-Item (Join-Path $installedBucket 'meigma-release-cli.json') -Force -ErrorAction SilentlyContinue
          $target = Join-Path $installedBucket ($candidatePath.Substring($checkout.Path.Length + 1))
          New-Item (Split-Path $target) -ItemType Directory -Force | Out-Null
          Copy-Item $candidatePath $target -Force

          Invoke-Scoop install meigma-rehearsal/meigma-release-cli
          $executable = Join-Path $env:SCOOP 'apps\meigma-release-cli\current\release-cli.exe'
          $output = & $executable version | Out-String
          Write-Host $output
          if ($LASTEXITCODE -ne 0 -or $output -notmatch [regex]::Escape($candidateVersion)) {
              throw "ARM64 command did not report candidate version $candidateVersion."
          }

          Invoke-Scoop uninstall meigma-release-cli
          if (Test-Path (Join-Path $env:SCOOP 'apps\meigma-release-cli')) {
              throw 'Scoop left the ARM64 application installed after uninstall.'
          }
